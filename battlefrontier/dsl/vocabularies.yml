# DSL 词表（PRD §5.2 + 硬性规矩「枚举开放」）：原语/选择器/触发器等一律
# 开放字符串 + 本文件，代码不写死。需要新词 = 在本文件对应段追加一行（零代码）。
# 初版 = task 005 首批原语清单（对齐 db effect_tags.yml 29+3 词表的语义边界）。

# 动作原语（原子操作）
actions:
  - draw                    # 抽牌（固定 N / 补至 N / 计数抽）
  - discard                 # 弃置（手牌→弃牌区；效果或成本）
  - search_deck             # 检索牌库（过滤器 + up-to-N + 去向）
  - shuffle_deck            # 重洗牌库
  - recover_from_discard    # 弃牌区回收（入手牌 / 回牌库 / 附着）
  - damage                  # 造成伤害（固定 / 变量公式）
  - place_damage_counters   # 放置伤害指示物（铺伤）
  - move_damage_counters    # 转放伤害指示物
  - attach_energy           # 额外附着能量（不受每回合 1 次限制）
  - move_energy             # 场上转附能量（不增量）
  - apply_status            # 施加特殊状态
  - clear_status            # 恢复特殊状态
  - switch                  # 换位（含强制对手 gust）
  - put_into_play           # 直接放上场（如基础宝可梦直放备战区）
  - evolve                  # 进化（含跳阶 / 从牌库进化）
  - hand_to_deck_bottom     # 手牌洗回牌库下方
  - copy_attack             # 复制招式
  - reveal                  # 给对手看过（展示）
  - modify_hp               # 声明式：常驻 HP 修正（道具 passive_static，引擎读声明，解释器不执行）
  - grant_attack            # 声明式：授予招式（道具 passive_static；discard_at_turn_end 等标记）
  - modify_weakness         # 声明式：弱点改写（特性 passive_static，如妖精领域；引擎读声明）
  - coin_flip               # 掷币（结果存 ExecutionContext，节点级门控 if_flip_* 读取）
  - heal                    # 恢复 HP（去伤害指示物，不超过已有伤害）
  - bounce                  # 放回手牌（场上宝可梦整叠回手，附着能量/道具进弃牌区）
  - modify_damage           # 声明式：招式伤害修正（道具 passive_static，如不服输头带；引擎读声明）
  - ko_self                 # 自我昏厥（这只宝可梦整叠弃置，对手拿奖赏；咒怨炸弹）
  - modify_retreat_cost     # 声明式：撤退费用修正（task 026 WP4：道具/特性 passive_static，引擎读声明，解释器不执行）
  - lock_attack             # 招式冷却锁（task 026 WP4 裁决 2：on_attack 内锁定本招式名，下个自己回合不可使用）
  - modify_attack_cost      # 声明式：招式费用修正（task 026 WP5：月月熊 赫月ex 老练招式；引擎 _effective_attack_cost 读声明，解释器不执行）
  - prize_bonus             # 奖赏加成标记（task 026 WP5 白蕾雅：回合级，太晶宝可梦招式伤害昏厥对手战斗场时多拿 1 张）
  - transform               # 变身替换（task 026 WP5 百变怪 变身启动：自身整叠进弃牌区，牌库基础宝可梦入原位置）
  - hand_disrupt            # 手牌扰乱（task 026 WP6 雪童子 惊吓：随机看对手 1 张手牌，洗回对手牌库）
  - bench_size              # 声明式：备战区容量覆写（task 026 WP6 零之大空洞；引擎读声明，解释器不执行）
  - lock_retreat            # 撤退锁（task 026 WP6 沙铃仙人掌 穷追不舍：目标下个自己回合无法撤退）
  - protection              # 声明式：效果免疫（task 026 WP6 火恐龙 闪焰之幕：不受对手招式效果影响；引擎读声明）
  - devolve                 # 退化（task 026 WP6 招式学习器 退化：移除进化卡放回手牌）

# 选择器（作用对象）
selectors:
  - self                    # 这只宝可梦
  - own_active              # 自己的战斗宝可梦（heal 等指向战斗场的目标）
  - opponent_active         # 对手战斗宝可梦
  - opponent_active_attack  # 对手战斗宝可梦所拥有的招式（复制目标）
  - own_hand                # 自己的手牌
  - own_deck                # 自己的牌库
  - own_discard             # 自己的弃牌区
  - own_pokemon_in_play     # 自己场上的宝可梦
  - own_attached_energy     # 自己场上宝可梦身上附着的能量（能量转移等）
  - own_bench               # 自己的备战区
  - opponent_pokemon_any    # 对手的 1 只宝可梦（含备战）
  - opponent_bench          # 对手的备战区
  - opponent_hand           # 对手的手牌（奇树：双方手牌洗回库底）
  - opponent_deck           # 对手的牌库（奇树：对手抽牌）
  - opponent_attacker       # 使用了招式的对手宝可梦（task 026 WP6 沙铃仙人掌 炸裂针刺：昏厥事件上下文）
  - opponent_pokemon_all    # 对手全部宝可梦（task 026 WP6 招式学习器 退化：逐只处理，无 choose）

# 触发器（区分主动发动与被动监听）
triggers:
  - on_play                 # 训练家卡从手牌使用
  - ability_manual          # 特性：自己回合主动发动
  - on_attack               # 招式附加效果
  - passive_static          # 常驻修正（如 HP+50 / 弱点改写）
  - trigger_on_event        # 事件监听（如跨回合昏厥条件）
  - stadium_grant           # 竞技场赋予双方每回合行动

# 计数表达式（count 字段除 int 外的合法字符串；all = 全部）
counters:
  - all
  - own_remaining_prizes           # 自己剩余奖赏卡张数
  - opponent_remaining_prizes      # 对手剩余奖赏卡张数
  - damage_counters_on_target      # 目标身上伤害指示物数量
  - damage_counters_on_self        # 自身身上伤害指示物数量
  - attached_energy_on_opponent_active  # 对手战斗宝可梦附着能量数量
  - bench_count_both               # 双方备战宝可梦数量
  - attached_energy_on_target      # 目标宝可梦附着能量数量（task 026 WP5 猛雷鼓 落雷风暴）
  - opponent_taken_prizes          # 对手已拿奖赏张数（=6−对手剩余奖赏；task 026 WP5 月月熊）
  - discarded_this_effect          # 本效果内前序 discard 节点弃置张数（task 026 WP5 ×N 伤害族）
  - flip_heads_count               # 本效果内掷币正面次数（task 026 WP5 until_tails 索财灵）

# 去向（destination 字段）
destinations:
  - hand
  - bench
  - deck
  - deck_bottom
  - discard
  - attach                # 附着于宝可梦
  - deck_top              # 放回牌库上方（task 026 WP6 暗码迷的解读：有序，选择顺序即牌顶 FIFO）

# 限次（limit 字段）
limits:
  - once_per_turn           # 每回合 1 次（每只/每张独立）
  - once_per_turn_shared    # 每回合 1 次（同名全卡组共享，如「化危为吉」）
  - unlimited               # 任意次

# 事件词（trigger_on_event 的 event 字段）
events:
  - own_play_from_hand_to_bench  # 自己的回合，从手牌使出放于备战区时（摔角鹰人 飞身入场）
  - own_evolve_from_hand         # 自己的回合，从手牌使出并进行进化时（猫头夜鹰 寻找宝石，task 026 WP3）
  - own_ko_by_attack             # 在战斗场受到对手招式伤害而昏厥时（task 026 WP6 沙铃仙人掌 炸裂针刺）
