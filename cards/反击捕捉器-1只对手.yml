# 反击捕捉器（CSM1DC-236，物品）——M1D 档「词序变体」异文本拆分档
# （同名多文本拆分纪律：本印刷「选择1只对手的备战宝可梦」与主类 12 印刷
# 「选择对手的1只备战宝可梦」归一化 text_raw 不一致，db 实测 2026-11-16；
# 语义逐字相同，仅词序差异。task 143 补挂批。）
# text_raw 原文：「这张卡牌，只有在自己的剩余奖赏卡张数，比对手的剩余奖赏卡张数多时才可使用。
#
# 选择1只对手的备战宝可梦，将其与战斗宝可梦互换。」
# condition 落在条件门（不满足不枚举）；被换下回备战区的宝可梦特殊状态清除（§4）。
# 效果语义与主类 反击捕捉器.yml 完全一致——改动只跟印刷走，勿与主类分道扬镳。
card:
  name_group: 反击捕捉器
  # 同文本等价类（db 归一化 text_raw 实测一致，2026-11-16）：M1D 档 1 印刷，
  # standard-2026-09-16 快照内合法
  card_ids: [CSM1DC-236]
effects:
  - trigger: on_play
    condition: own_prizes_more_than_opponent
    actions:
      - {action: switch, selector: opponent_bench, choose: 1}
