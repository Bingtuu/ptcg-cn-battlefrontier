# 吉雉鸡ex（CSV8C-135，基础）
# text_raw 原文：「特性: 化危为吉
# 在上一个对手的回合，如果自己的宝可梦【昏厥】的话，则在自己的回合可以使用1次。
# 从自己牌库上方抽取3张卡牌。在这个回合，如果已经使用了其他的「化危为吉」的话，
# 则无法使用这个特性。
# 残忍箭矢：给对手的1只宝可梦，造成100伤害。[备战宝可梦不计算弱点、抗性。]」
# 「上一个对手的回合…昏厥」= 跨回合 KO 标记 condition（own_ko_during_opponent_turn，
# task 017）；「其他的化危为吉」= once_per_turn_shared（task 011）。
# 备战不计算弱点抗性是贯穿规则（rules-manual §6），引擎骨架已保证，DSL 无需特判。
card:
  name_group: 吉雉鸡ex
  card_ids: [CSV8C-135]
effects:
  - trigger: ability_manual
    limit: once_per_turn_shared
    condition: own_ko_during_opponent_turn
    actions:
      - {action: draw, count: 3}
  - trigger: on_attack
    attack: 残忍箭矢
    actions:
      - {action: damage, selector: opponent_pokemon_any, choose: 1, args: {amount: 100}}
