# 土龙节节（CSV7C-162，1阶，特性：逃跑抽取）
# text_raw 原文：「特性: 逃跑抽取
# 在自己的回合可以使用1次。从自己牌库上方抽取3张卡牌。然后，将这只宝可梦，
# 以及放于其身上的所有卡牌，放回牌库并重洗牌库。
#
# 【无】【无】【无】 大地粉碎 90」
# 特性两段：抽 3（draw count=3，牌库不足抽尽即止不判负）→ 自身整叠+附着能量/
# 道具回牌库（bounce_to_deck，task 136 新原语：非昏厥离场不触发昏厥/奖赏，
# 战斗场来源有备战→换上后继续主阶段、无备战→判负，同 bounce 附录 A 决议）
# → 重洗由后续 shuffle_deck 节点表达（DSL 编写纪律，厉害钓竿先例）。
# 招式「大地粉碎」90 伤无附加文本：卡面数据承载，无 DSL 效果。
card:
  name_group: 土龙节节
  # 同文本等价类（db 归一化 text_raw 实测一致，2026-11-15）：H 标 3 印刷，
  # 均在最新 standard 快照（2026-09-16）合法集内。
  # G 标 2 印刷（CSV3C-099 / CSV3C-138，异文本「掘遁闪光」）为另一等价类，
  # 本批不入档（helpers.py 白名单主会话集中管），见 task 136 报告遗留项。
  card_ids: [CSV7C-162, CSV9.5C-144, CSVM2cC-009]
effects:
  - trigger: ability_manual
    limit: once_per_turn
    actions:
      - {action: draw, count: 3}
      - {action: bounce_to_deck, selector: self}
      - {action: shuffle_deck}
