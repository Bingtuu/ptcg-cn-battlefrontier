# 太晶珠（CSV9C-181，物品）
# text_raw 原文：「选择自己牌库中的1张「太晶」宝可梦，在给对手看过之后，加入手牌。并重洗牌库。」
# pokemon_tera = CardDef.is_tera（task 071 WP1）。
card:
  name_group: 太晶珠
  card_ids: [CSV9C-181, CSV9.5C-165, SVP-407]
effects:
  - trigger: on_play
    observe: [key_search]
    actions:
      - {action: search_deck, selector: own_deck, filters: [pokemon_tera], choose: 1, destination: hand}
      - {action: reveal, selector: own_hand, filters: [pokemon_tera]}
      - {action: shuffle_deck}
