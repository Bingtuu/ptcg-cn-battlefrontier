# 见 task 026 WP7 范围纪律）
# text_raw 原文：「【火】 烧光
# 将场上的竞技场放于弃牌区。
#
# 【火】【火】 吐火 30」
# 烧光（task 026 WP7，D-WP7-6）：discard_stadium——公共场进其持有者弃牌区 +
