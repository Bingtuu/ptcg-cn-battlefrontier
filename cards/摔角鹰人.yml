# 摔角鹰人（CSV1C-079，基础，特性：飞身入场）
# text_raw 原文：「特性: 飞身入场
# 在自己的回合，当将这张卡牌从手牌使出放于备战区时，可使用1次。给对手的2只备战宝可梦身上，
# 各放置1个伤害指示物。
#
# 【斗】【无】【无】 翅膀攻击 70」
# trigger_on_event=own_play_from_hand_to_bench（task 026 WP2）：仅主阶段从手牌放备战区
# 触发（setup 放置 / DSL 检索直放均不触发）；「可使用」的放弃选项不建模、满足即自动发动
# （rules-reference 附录 A·2026-09-07 决议）；对手备战不足 2 只时按池大小收缩（尽力而为）。
# 翅膀攻击 70 无效果文，由引擎白板伤害结算，无需 DSL 绑定。
card:
  name_group: 摔角鹰人
  # 同文本等价类（db 归一化 text_raw 实测一致，2026-09-07）：全 G 标
  card_ids: [CSV1C-079, CSV9.5C-095, CSVE2pC-005, CSVL1C-035, CSVL1C-076, CSVM2bC-003, SVP-079, SVP-289]
effects:
  - trigger: trigger_on_event
    event: own_play_from_hand_to_bench
    actions:
      - {action: place_damage_counters, selector: opponent_bench, choose: 2, args: {counters: 1}}
