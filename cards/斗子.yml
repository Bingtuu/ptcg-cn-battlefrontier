# 斗子（CSV10.6C-085，支援者）
# text_raw 原文：「选择自己牌库中的进化宝可梦和能量各1张，在给对手看过之后加入手牌。并重洗牌库。」
# 两段式检索（各 up-to 1，检索「选择…1张」引擎统一 up-to 口径，高级球先例）：
# 先进化宝可梦 ×1 后能量 ×1，两段独立 chooser 交互；choose_groups 不适用——
# 其语义为组间互斥「或」（小刚的发掘 D-WP6-3），跨组各取 1 不可达。「能量」不限
# 基本（chooser energy = 能量卡超类型，特殊能量可检）；「给对手看过」= 两段检索
# 完成后 reveal own_hand 按组各落一条事件（仅结构化事件流，D-WP3-4）；检索后必洗牌。
card:
  name_group: 斗子
  # 同文本等价类（db 归一化 text_raw 实测一致，2026-11-14）：最新 standard 快照（2026-09-16）合法 5 印刷
  card_ids: [CSV10.6C-085, CSV10.6C-166, CSV10.6C-173, SVP-364, SVP-486]
effects:
  - trigger: on_play
    # 决策聚合锚点（task 022）：检索选牌为关键决策点
    observe: [key_search]
    actions:
      - {action: search_deck, selector: own_deck, filters: [evolved_pokemon], choose: 1, destination: hand}
      - {action: search_deck, selector: own_deck, filters: [energy], choose: 1, destination: hand}
      - {action: reveal, selector: own_hand, filters: [evolved_pokemon]}
      - {action: reveal, selector: own_hand, filters: [energy]}
      - {action: shuffle_deck}
