# 朋友手册（CS1DC-174，物品）
# text_raw 原文：「选择自己弃牌区中最多2张支援者，在给对手看过之后，放回牌库并重洗牌库。」
# recover_to_deck 为 up-to 语义（min_choose=0，对齐「最多2张」）；
# 「给对手看过」为公开性说明不建模（与高级球等既有卡一致）；洗牌由 shuffle_deck 节点表达。
# 仅收同文本印刷（task 026 审计，2026-09-06 决议：（卡名+文本）等价类严格拆分）：
# 「2张」（无「最多」）异文本类已剔除（CSM1DC-246/CSM1bC-121/CSM2.1C-006/CSM2DC-255/
# CSMPkC-010/CSMPoC-007/SSP-NaN48~50，均非池内使用；如需其语义请新建 朋友手册-<区分词>.yml）。
card:
  name_group: 朋友手册
  card_ids: [CS1DC-174, CS2.1C-003, CSV1C-111, CSV6C-163, CSVE1C-115, CSVE2C-151, CSVH2aC-012, SVP-349, SVP-NaN18, SVP-NaN19, SVP-NaN20]
effects:
  - trigger: on_play
    # 决策聚合锚点（task 022）：回收选牌为关键决策点
    observe: [key_search]
    actions:
      - {action: recover_from_discard, selector: own_discard, filters: [trainer_supporter], choose: 2, destination: deck}
      - {action: shuffle_deck}
