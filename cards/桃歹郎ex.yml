# 桃歹郎ex（CSV8C-136，基础，恶属性 ex 190）
# text_raw 原文：「特性: 支配锁链
# 在自己的回合可以使用1次。选择自己备战区中的1只【恶】宝可梦（除「桃歹郎【ex】」外），将其与战斗宝可梦互换。然后，令新的战斗宝可梦陷入【中毒】状态。在这个回合，如果已经使用了其他的「支配锁链」的话，则无法使用这个特性。
#
# 【恶】【恶】 焦躁爆破 60×
# 造成对手已经获得的奖赏卡张数×60伤害。」
# 支配锁链（task 139）：ability_manual + limit once_per_turn_shared——「使用了
# 其他的「支配锁链」」= 同名共享锁（大比鸟ex 音速搜索先例：按卡名键控，本卡为
# 该能力名唯一持有者，键控口径等价）。switch selector=own_bench choose=1 +
# filters=[pokemon_恶, not_name:桃歹郎ex]（D-139-3：备战池属性过滤 + 具名排除，
# 过滤后无目标 → 特性不枚举）；apply_status selector=own_active status=poisoned
# （D-139-4：新战斗宝可梦中毒——节点序在 switch 后即「然后」）。换位回备战区的
# 原战斗宝可梦特殊状态清除（rules-manual §7.1，switch 原语口径）。
# 焦躁爆破：damage count=opponent_taken_prizes（=6−对手剩余奖赏，月月熊
# 老练招式同计数词）per=60 op="×"；对手未拿奖赏 = 0 伤害（攻击照常消耗）。
card:
  name_group: 桃歹郎ex
  # 同文本等价类（db 归一化 text_raw 实测一致，2026-11-15）：全 H 标 7 印刷
  card_ids: [CSV8C-136, CSV8C-227, CSV8C-250, CSV8C-257, CSV9.5C-116, CSV9.5C-241, CSVNC-029]
effects:
  - trigger: ability_manual
    limit: once_per_turn_shared
    actions:
      - {action: switch, selector: own_bench, choose: 1, filters: [pokemon_恶, not_name:桃歹郎ex]}
      - {action: apply_status, selector: own_active, args: {status: poisoned}}
  - trigger: on_attack
    attack: 焦躁爆破
    actions:
      - {action: damage, selector: opponent_active, count: opponent_taken_prizes, args: {op: "×", per: 60}}
