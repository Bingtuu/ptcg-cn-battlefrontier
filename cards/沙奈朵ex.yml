# 沙奈朵ex（CSV2C-055，2阶，特性：精神拥抱）
# text_raw 原文：「特性: 精神拥抱
# 在自己的回合可以使用任意次。选择自己弃牌区中的1张「基本【超】能量」，附着于自己的
# 【超】宝可梦身上。然后，在被附着的宝可梦身上放置2个伤害指示物。（对会被【昏厥】的
# 宝可梦，无法使用这个特性。）」
# 「会昏厥不可选」落在目标过滤器 would_survive_20；招式「奇迹之力」的特殊状态恢复
# 效果归 on_attack 落地（task 012+），CardDef.attacks 只承载伤害骨架。
card:
  name_group: 沙奈朵ex
  card_ids: [CSV2C-055]
effects:
  - trigger: ability_manual
    limit: unlimited
    actions:
      - {action: attach_energy, selector: own_discard, filters: [basic_energy, energy_超], choose: 1, destination: attach, args: {target_filters: [pokemon_超, would_survive_20], damage_counters: 2}}
