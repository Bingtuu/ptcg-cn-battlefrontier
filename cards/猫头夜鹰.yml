# 猫头夜鹰（CSV9C-155，1阶，特性：寻找宝石）
# text_raw 原文：「特性: 寻找宝石
# 在自己的回合，当将这张卡牌从手牌使出并进行进化时，如果自己场上有「太晶」宝可梦的话，则可以使用1次。选择自己牌库中最多2张训练家，在给对手看过之后，加入手牌。并重洗牌库。
#
# 【无】【无】 高速之翼 60」
# trigger_on_event=own_evolve_from_hand（task 026 WP3）：触发口径 = 进化卡本身从手牌
# 使出——主阶段从手牌进化 + 神奇糖果（skip_stage，手牌压上）均触发；牌库进化
# （招式学习器「进化」）不触发（rules-reference 附录 A，2026-09-14 用户裁决）；
# 「可使用」的放弃选项不建模、条件满足即自动发动。reveal 一期口径：仅落结构化事件流（iids+卡名），
# 对手可见视图不建模泄露。「最多2张」= 检索统一 up-to 纪律（min_choose=0）。
# 高速之翼 60 无效果文，由引擎白板伤害结算，无需 DSL 绑定。
card:
  name_group: 猫头夜鹰
  # 同文本等价类（db 归一化 text_raw 实测一致，2026-09-14）：全 H 标；
  # 其余文本类（山劫/寂静之翼/钩爪狩猎等 D/F/H 标）未写，不在本文件挂载
  card_ids: [CSV9.5C-142, CSV9C-155, CSV9C-214, CSVM2aC-011, SVP-291]
effects:
  - trigger: trigger_on_event
    event: own_evolve_from_hand
    condition: own_tera_in_play
    # 决策聚合锚点（task 022）：检索选牌为关键决策点
    observe: [key_search]
    actions:
      - {action: search_deck, selector: own_deck, filters: [trainer], choose: 2, destination: hand}
      - {action: reveal, selector: own_hand, filters: [trainer]}
      - {action: shuffle_deck}
