# 玻璃喇叭（CSV9C-178，物品）
# text_raw 原文：「这张卡牌，只有在自己场上有「太晶」宝可梦时才可使用。
#
# 选择自己备战区中最多2只【无】宝可梦，各附着1张弃牌区中的基本能量。」
# own_tera_in_play 使用门；multi_target × target_pool=own_bench（task 071 WP4）
# 逐只各附 1；目标过滤器 pokemon_无。
card:
  name_group: 玻璃喇叭
  card_ids: [CSV9C-178, CSV9.5C-160, SVP-283]
effects:
  - trigger: on_play
    condition: own_tera_in_play
    actions:
      - {action: attach_energy, selector: own_discard, filters: [basic_energy], choose: 2, destination: attach, args: {multi_target: true, target_pool: own_bench, target_filters: ["pokemon_无"]}}
