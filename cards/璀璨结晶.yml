# 璀璨结晶（CSV8C-186，宝可梦道具 ACE SPEC）
# text_raw 原文：「身上放有这张卡牌的「太晶」宝可梦使用招式时，使用那个招式所需能量，减少1个。（减少的可以是任意属性的能量。）」
# modify_attack_cost types:all（task 069 WP3，D-WP5-4 口径扩展）：减免 1 个任意属性
# 符号——确定性取法钉死：优先减【无】，无【无】则按 cost 序列首个有色符号；
# condition holder_is_tera（task 069 WP3）对持有者求值；道具分支 attack 缺省 = 全招式。
# 道具离场/被消除（阻碍之塔）即失效（求值点实时读声明，天然满足）。
card:
  name_group: 璀璨结晶
  # 同文本等价类（db 归一化 text_raw 实测一致，2026-10-21）：全 H 标 2 印刷
  card_ids: [CSV8C-186, CSV9.5C-172]
effects:
  - trigger: passive_static
    condition: holder_is_tera
    actions:
      - {action: modify_attack_cost, args: {value: 1, types: all}}
