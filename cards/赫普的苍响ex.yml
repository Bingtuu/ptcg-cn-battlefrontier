# 赫普的苍响ex（CSV10C-161，基础，规则盒 ex，钢属性）
# text_raw 原文：「【无】 刹那斩 30
# 给对手的1只备战宝可梦也造成30伤害。[备战宝可梦不计算弱点、抗性。]
#
# 【钢】【钢】【钢】【无】 英勇之刃 240
# 在下一个自己的回合，这只宝可梦无法使用「英勇之刃」。」
# 刹那斩 30 + 备战狙击 30（task 029，D-029-4）：damage opponent_bench choose=1——
# 备战空 → 该节点 no-op、主战 30 照算；「备战宝可梦不计算弱点、抗性」= rule_reference
# 句（task 009 约定排除），引擎贯穿规则天然满足，猛雷鼓先例。
# 英勇之刃 240 + lock_attack（月月熊 血月先例，task 026 WP4 裁决 2）：「下一个自己
# 的回合无法使用『英勇之刃』」= on_attack 内 lock_attack self——锁本效果块绑定招式名，
# 下个自己回合不可宣言、再下个解禁；撤退/离场清除（刹那斩不受影响）。
card:
  name_group: 赫普的苍响ex
  # 同文本等价类（db 归一化 text_raw 实测一致，2026-09-20）：全库 4 印刷单类，全 I 标
  card_ids: [CSV10C-161, CSV10C-247, CSV10C-274, SVP-404]
effects:
  - trigger: on_attack
    attack: 刹那斩
    actions:
      - {action: damage, selector: opponent_active, args: {amount: 30}}
      - {action: damage, selector: opponent_bench, choose: 1, args: {amount: 30}}
  - trigger: on_attack
    attack: 英勇之刃
    actions:
      - {action: damage, selector: opponent_active, args: {amount: 240}}
      - {action: lock_attack, selector: self}
