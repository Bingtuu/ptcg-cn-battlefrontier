# 重力山（CSV7C-201，竞技场）
# text_raw 原文：「双方场上的所有【2阶进化】宝可梦的最大HP，各「-30」。」
# modify_hp 竞技场来源（task 139，D-139-5）：passive_static 声明读点从道具扩到
# 场上竞技场——args.amount=-30（负修正）+ args.target_filters=[stage2_pokemon]
# （场上维度过滤器词表，开放字符串进 chooser 求值）——双方场上【2阶进化】
# 有效 HP -30；基础/1 阶不受影响。有效 HP 动态求值：场被顶/被弃即恢复
# （同阻碍之塔 D-029-2 口径）；伤害 ≥ 新有效 HP（剩余 HP ≤ 0）昏厥走
# 既有 _do_play_stadium 打出后检查触点（rules-manual §8）。
card:
  name_group: 重力山
  # 同文本等价类（db 归一化 text_raw 实测一致，2026-11-15）：全 H 标 2 印刷
  card_ids: [CSV7C-201, CSV8C-261]
effects:
  - trigger: passive_static
    actions:
      - {action: modify_hp, args: {amount: -30, target_filters: [stage2_pokemon]}}
