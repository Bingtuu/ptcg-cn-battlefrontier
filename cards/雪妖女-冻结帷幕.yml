# 雪妖女（CSV7C-059，1阶，水属性，特性：冻结帷幕）——「冻结帷幕/冰霜粉碎」文本类
# （同名多文本拆分：CS3bC-040 / CS6bC-013 / CSM2aC-032 异文本类另文，
# 见 task 026 WP7 范围纪律）
# text_raw 原文：「特性: 冻结帷幕
# 只要这只宝可梦在场上，每当宝可梦检查时，给双方所有拥有特性的宝可梦（除「雪妖女」外）身上，各放置1个伤害指示物。
#
# 【水】【无】 冰霜粉碎 60」
# 冻结帷幕（task 026 WP7，D-WP7-11）：trigger_on_event pokemon_check（双方回合
# 结束后的宝可梦检查统一触发，D-WP7-1 第⑤步）；place_damage_counters
# all_pokemon_both 无 choose 逐只放置，filters=[has_ability, not_name:雪妖女]
# 收敛目标池（「拥有特性」← CardDef.has_ability ← db abilities 非空）；多只雪妖女
# 各触发各结算（原文无「不重复」注，从字面）；离场即失效（排水点语义）。
# 冰霜粉碎 60 无效果文，由引擎白板伤害结算，无需 DSL 绑定。
card:
  name_group: 雪妖女
  # 同文本等价类（db 归一化 text_raw 实测一致，2026-09-20）：10 印刷
  card_ids: [CBB4C-1201, CBB4C-1202, CBB4C-1203, CBB4C-1204, CBB4C-1205, CBB4C-1206,
             CBB4C-1207, CSV7C-059, CSV9.5C-044, SVP-412]
effects:
  - trigger: trigger_on_event
    event: pokemon_check
    actions:
      - {action: place_damage_counters, selector: all_pokemon_both, filters: [has_ability, "not_name:雪妖女"], args: {counters: 1}}
