# 雪童子（CSV6C-032，基础，水属性）——G 标「冰砾」文本类
# （同名多文本拆分纪律：本印刷与 雪童子.yml（H 标惊吓类 2 印刷）归一化
# text_raw 不一致，db 实测 2026-11-15；task 139 印刷补挂侧 quest：
# CSV6C-032 判异文本 → 拆分新档）
# text_raw 原文：「【水】 冰砾 10+
# 如果对手的战斗宝可梦为【斗】宝可梦的话，则追加造成30伤害。」
# 冰砾：两段式 damage（基准 10 无条件 + 30 门控，胖嘟嘟ex 力量压制/古玉鱼
# 嫉妒业火同口径）——节点条件 if_opponent_active_type:斗（task 139，D-139-8：
# 对手战斗宝可梦栈顶属性 = 【斗】放行，属性词开放字符串）；两段节点各吃
# 一次攻方 modify_damage（既有近似，力量压制遗留②同口径）。
card:
  name_group: 雪童子
  # 同文本等价类（db 归一化 text_raw 实测一致，2026-11-15）：G 标 2 印刷
  card_ids: [CSV6C-032, CSVL2C-097]
effects:
  - trigger: on_attack
    attack: 冰砾
    actions:
      - {action: damage, selector: opponent_active, args: {amount: 10}}
      - {action: damage, selector: opponent_active, condition: if_opponent_active_type:斗, args: {amount: 30}}
