# 黑夜魔灵（CSV8C-083，2阶，特性：咒怨炸弹）——「咒怨炸弹/影子束缚」H 标文本类
# （同名多文本严格拆分：全库 5 文本类仅挂池内类，其余未写，见 task 029 范围纪律）
# text_raw 原文：「特性: 咒怨炸弹
# 在自己的回合可以使用1次，如果使用了，则令这只宝可梦【昏厥】。给对手的1只宝可梦身上，
# 放置13个伤害指示物。
#
# 【超】【超】【无】 影子束缚 150
# 在下一个对手的回合，受到这个招式影响的宝可梦，无法撤退。」
# 咒怨炸弹（task 029，彷徨夜灵同构）：ability_manual once_per_turn + ko_self——语序
# 保真：先自我昏厥（对手立即拿奖赏）、后给对手 1 只放 13 个伤害指示物（非 5，卡面
# 原文）；战斗场自我昏厥的换上推迟到效果全部结算完毕后按 promote_queue 统一进行
# （rules-reference 附录 A·2026-09-07 决议）。
# 影子束缚 150 + lock_retreat（沙铃仙人掌 穷追不舍同构，D-WP6-7）：锁对手战斗场
# 撤退，目标下个自己回合结束解除（进化亦清除）；伤害 150 照算。
card:
  name_group: 黑夜魔灵
  # 同文本等价类（db 归一化 text_raw 实测一致，2026-09-20）：池内 H 标 4 印刷
  card_ids: [CSV8C-083, CSV8C-212, CSV9.5C-071, SVP-348]
effects:
  - trigger: ability_manual
    limit: once_per_turn
    actions:
      - {action: ko_self, selector: self}
      - {action: place_damage_counters, selector: opponent_pokemon_any, choose: 1, args: {counters: 13}}
  - trigger: on_attack
    attack: 影子束缚
    actions:
      - {action: damage, selector: opponent_active, args: {amount: 150}}
      - {action: lock_retreat, selector: opponent_active}
