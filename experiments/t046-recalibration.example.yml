# task 046 复校准：调优采纳参数（deck_low_threshold 6→12，待 WP3 双门槛过线后启用）
# 全 matrix 36 配对 × 500 局，双侧均为调优参数（校准矩阵两侧同 Agent 口径同 M6）。
