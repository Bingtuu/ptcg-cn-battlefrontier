name: t046-recalibration
seed_start: 100000
matrix:
  pool: config/target-pool.v1.yml
  games_per_pair: 500
agents:
  a: {type: heuristic, params: {deck_low_threshold: 12}}
  b: {type: heuristic, params: {deck_low_threshold: 12}}
