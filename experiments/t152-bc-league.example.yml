# task 152 WP3：BC 学生联赛评估注册表（提升门 + kill criteria 判读面）
# 预注册冻结：2026-11-21（评估预算段写入 tasks/task 152.md 后不得变更）
# 结构（task 127 设施）：3 无序对 × 10 decks(v2.x) × ab/ba 双向 = 60 细胞
#   × games_per_cell 8 = 480 局（其中 MCTS 教师参赛 320 局）
# 教师口径 = task 151 数据集同款（2×50 cap50 + eval-linear-v3 截断 10，
#   联赛基线锚可比性）；bc-student = task 152 WP2 资产（v2.x 词表）
# 成本核算：MCTS 局 ~9.65 min（578.9s 实测）× 320 ÷ 16 workers ≈ 200 min
#   独占口径；桌面争抢实测 ~2.3× → 整夜档 ~8-9h。bc/heur 局 ~0.1s 忽略。
# 功效披露：每无序对 160 局（10 decks × 16），CRN 双向配对对冲先手偏差；
#   判读若落在 CI 覆盖 0 且 |点估计| ≥ 3pp 的 inconclusive 带 → Owner 预算
#   修正案，不得临场加局（预注册纪律）。
